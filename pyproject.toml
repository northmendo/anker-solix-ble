[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anker-solix-ble"
version = "0.1.0"
description = "Local BLE monitoring for Anker SOLIX F1200 / 757 PowerHouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["bleak>=0.21.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["anker_ble"]
